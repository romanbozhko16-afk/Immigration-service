[project]
name = "uscis-form-assistant"
version = "0.1.0"
description = "AI-assisted intake and form preparation for USCIS Form I-765. Not a law firm; no legal advice."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uscis_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
