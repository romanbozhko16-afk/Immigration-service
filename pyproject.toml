[project]
name = "uscis-form-assistant"
version = "0.1.0"
description = "AI-assisted intake and form preparation for USCIS Form I-765. Not a law firm; no legal advice."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15,<2",
    "cryptography>=50.0.2",
    "fastapi>=0.143,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pypdf>=6.21.1",
    "sqlalchemy>=2.1,<3",
    "uvicorn>=0.40",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uscis_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# User-facing sentences in three languages; splitting them hurts readability.
"src/uscis_assistant/interview/texts.py" = ["E501"]
"src/uscis_assistant/reference/texts.py" = ["E501"]
